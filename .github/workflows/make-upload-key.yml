name: Make Play upload key (run once)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  make-key:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create and encrypt the upload key
        env:
          PW: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if [ -z "$PW" ]; then echo "::error::Add the SIGNING_PASSWORD repository secret first."; exit 1; fi
          if [ -f signing/upload.p12.enc ]; then echo "::error::An upload key already exists. Not replacing it."; exit 1; fi
          mkdir -p signing
          keytool -genkeypair -storetype PKCS12 -keystore "$RUNNER_TEMP/upload.p12" -alias upload \
            -keyalg RSA -keysize 4096 -validity 10000 \
            -storepass "$PW" -keypass "$PW" -dname "CN=SonoraPulse Upload Key, O=${{ github.repository_owner }}"
          openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -salt \
            -in "$RUNNER_TEMP/upload.p12" -out signing/upload.p12.enc -pass env:PW
          rm -f "$RUNNER_TEMP/upload.p12"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add signing/upload.p12.enc
          git commit -m "Add encrypted Play upload key"
          git push
